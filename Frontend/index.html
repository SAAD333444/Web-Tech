<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Manager</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px 0px #aaa; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        button { cursor: pointer; padding: 5px 10px; margin: 2px; }
        .form-group { margin-bottom: 10px; }
        input { padding: 8px; width: 90%; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Record Manager</h2>
        
        <div style="background: #e9ecef; padding: 15px; border-radius: 5px;">
            <h3 id="formTitle">Add New Student</h3>
            <div class="form-group"><input type="hidden" id="studentId"></div>
            <div class="form-group"><input type="text" id="name" placeholder="Full Name" required></div>
            <div class="form-group"><input type="text" id="rollNo" placeholder="Roll Number" required></div>
            <div class="form-group"><input type="email" id="email" placeholder="Email Address" required></div>
            <button onclick="saveStudent()" style="background: green; color: white;">Save Student</button>
            <button onclick="clearForm()">Cancel</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
